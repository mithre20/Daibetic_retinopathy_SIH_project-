<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="XAIRIS — Healthcare Worker Authentication & Registration. Explainable AI for Diabetic Retinopathy Screening.">
    <title>XAIRIS — Clinical Staff Authentication &amp; Edge Terminal</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-page-viewport">

        <!-- ===== BACKGROUND REVOLVING AI DR SCREENING ENVIRONMENT ===== -->
        <div class="ai-dr-bg-canvas" aria-hidden="true">
            <!-- Static Retinal AI Screening Background Image Layer -->
            <div class="static-bg-image-layer"></div>
            <div class="static-bg-vignette"></div>

            <!-- Ambient Soft Light Orbs & Grid -->
            <div class="ambient-glow orb-1"></div>
            <div class="ambient-glow orb-2"></div>
            <div class="ambient-glow orb-3"></div>
            <div class="ambient-grid-pattern"></div>
        </div>

        <!-- ===== CLINICAL AUTHENTICATION CARD ===== -->
        <main class="auth-main-card">
            <!-- ================= AUTHENTICATION FORM ================= -->
            <div class="auth-card-right">
                <!-- ================= 1. LOGIN FORM ================= -->
                <form id="form-login" class="auth-form-panel active" onsubmit="handleLogin(event)">
                    <div class="form-heading-group">
                        <div class="form-heading-row">
                            <h3 class="form-main-title">Staff &amp; Doctor Login</h3>
                            <span class="terminal-badge">Unified Terminal</span>
                        </div>
                        <p class="form-sub-title">Unified clinical access for Medical Doctors, Specialists &amp; Health Center Staff</p>
                    </div>

                    <!-- Role Selector -->
                    <div class="role-selector-toggle" role="radiogroup" aria-label="Staff Role">
                        <label class="role-toggle-chip role-chip active" onclick="selectRole(this, 'doctor')">
                            <input type="radio" name="login-role" value="doctor" checked>
                            <span class="role-icon">🩺</span>
                            <div class="role-label-col">
                                <span class="role-name">Doctor / Specialist</span>
                                <span class="role-sub">Doctor Profile, Patients &amp; Sign Reports</span>
                            </div>
                            <span class="role-check-indicator"></span>
                        </label>
                        <label class="role-toggle-chip role-chip" onclick="selectRole(this, 'phc')">
                            <input type="radio" name="login-role" value="phc">
                            <span class="role-icon">🏥</span>
                            <div class="role-label-col">
                                <span class="role-name">Health Center Staff / PHC</span>
                                <span class="role-sub">Patient Screening Camp Terminal</span>
                            </div>
                            <span class="role-check-indicator"></span>
                        </label>
                    </div>

                    <!-- Medical Registration ID / Email -->
                    <div class="input-control-group">
                        <label for="login-id">Medical Registration ID or Official Email</label>
                        <div class="input-box-wrapper">
                            <svg class="field-icon" width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M2.5 6.5A2.5 2.5 0 015 4h10a2.5 2.5 0 012.5 2.5v7a2.5 2.5 0 01-2.5 2.5H5a2.5 2.5 0 01-2.5-2.5v-7z" stroke="currentColor" stroke-width="1.6"/><path d="M3 6.5l7 4.5 7-4.5" stroke="currentColor" stroke-width="1.5"/></svg>
                            <input type="text" id="login-id" placeholder="e.g. dr.anitha@phc.gov.in" required value="dr.anitha@phc.gov.in" autocomplete="username">
                        </div>
                    </div>

                    <!-- Password / Security PIN -->
                    <div class="input-control-group">
                        <div class="label-with-action">
                            <label for="login-password">Password or 4-Digit Security PIN</label>
                            <a href="#" class="link-forgot" onclick="handleForgot(event)">Forgot Password?</a>
                        </div>
                        <div class="input-box-wrapper">
                            <svg class="field-icon" width="16" height="16" viewBox="0 0 20 20" fill="none"><rect x="4" y="9" width="12" height="8" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M7 9V6a3 3 0 016 0v3" stroke="currentColor" stroke-width="1.6"/></svg>
                            <input type="password" id="login-password" placeholder="••••••••" required value="vision2026" autocomplete="current-password">
                            <button type="button" class="btn-pw-eye" id="btn-toggle-pw" onclick="togglePasswordVisibility('login-password')" title="Toggle password visibility" aria-label="Toggle password visibility">
                                <svg class="eye-open-icon" width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z" stroke="currentColor" stroke-width="1.4"/></svg>
                                <svg class="eye-closed-icon" width="18" height="18" viewBox="0 0 20 20" fill="none" style="display:none;"><path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z" stroke="currentColor" stroke-width="1.4"/><path d="M3 3l14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me Checkbox -->
                    <div class="remember-row">
                        <label class="custom-checkbox-wrap">
                            <input type="checkbox" id="remember-me" checked>
                            <span class="custom-check-box"></span>
                            <span class="check-text">Keep terminal authorized on this local device (Offline Cache)</span>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-primary-auth" id="btn-login-submit">
                        <span class="btn-label-text" id="btn-login-label">Authenticate &amp; Open Doctor Profile</span>
                        <svg class="btn-arrow-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </button>

                    <!-- Quick PIN Login Alternative -->
                    <div class="pin-quick-login-area">
                        <div class="divider-text-line">
                            <span>OR QUICK 4-DIGIT PIN AUTHENTICATION</span>
                        </div>
                        <div class="pin-inputs-row" id="pin-container">
                            <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-digit" id="pin-0" aria-label="PIN digit 1" autocomplete="one-time-code">
                            <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-digit" id="pin-1" aria-label="PIN digit 2" autocomplete="one-time-code">
                            <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-digit" id="pin-2" aria-label="PIN digit 3" autocomplete="one-time-code">
                            <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-digit" id="pin-3" aria-label="PIN digit 4" autocomplete="one-time-code">
                        </div>
                        <div class="pin-actions-row">
                            <span class="pin-sub-instruction">Staff &amp; Doctors: Enter your 4-digit PIN (Doctor: 2026 • PHC: 1080)</span>
                            <button type="button" class="btn-pin-clear" onclick="clearPinInputs()" title="Clear PIN digits">Clear PIN</button>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast-root"></div>

    <script src="login.js"></script>
</body>
</html>
